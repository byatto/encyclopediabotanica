<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Houseplant Catalogue</title>

<!--
  ================================================================
  HOUSEPLANT CATALOGUE — v3
  ================================================================
  HOW THIS WORKS
  --------------
  This file is the template and stylesheet. It does not contain
  any plant data. Plant data lives in plants.js next to this file.

  To add or edit plants: open plants.js in a text editor.
  To print: Chrome or Edge → Print → Save as PDF → A4 → tick
    "Background graphics".
  To save a standalone copy: click "Save frozen copy" in the bar
    at the top of this page (it disappears when printing).

  FILE LAYOUT
  -----------
  houseplant-catalogue/
  ├── catalogue.html        ← this file
  ├── plants.js             ← your plant data (edit this)
  ├── fonts/                ← self-hosted font files (do not move)
  │   ├── inter-variable.woff2
  │   └── newsreader-italic-variable.woff2
  ├── photos/               ← your plant photos
  └── new-plant-prompt.md   ← AI prompt for generating new records
  ================================================================
-->

<style>
  /* ============================================================
     FONTS
     Self-hosted so the catalogue works offline forever.
     Inter  = body text, labels, everything except Latin names.
     Newsreader italic = Latin species names only.

     TODO (if fonts appear wrong): make sure the two .woff2 files
     are in a "fonts/" folder next to this file.
     ============================================================ */

  @font-face {
    font-family: "Inter";
    src: url("fonts/inter-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Newsreader";
    src: url("fonts/newsreader-italic-variable.woff2") format("woff2");
    font-weight: 400 700;
    font-style: italic;
    font-display: swap;
  }

  /* ============================================================
     DESIGN TOKENS — do not change these; they match v2 exactly.
     ============================================================ */
  :root {
    --ink:        #2a2d28;
    --soft:       #5c5f57;
    --faint:      #9a9d92;
    --hair:       #e3e4dd;
    --hair-soft:  #eeefe9;
    --paper:      #fcfcf9;
    --green:      #5a6b4d;
    --green-soft: #7d8a6f;
  }

  /* ============================================================
     BASE
     ============================================================ */
  * { box-sizing: border-box; }

  html { background: #d8d9d2; } /* screen: warm grey "desk" */

  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    line-height: 1.6;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Latin species names — Newsreader italic everywhere they appear */
  .latin {
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
  }

  /* ============================================================
     PAGE SHELL
     One <article class="page"> per plant, A4 sized.
     ============================================================ */
  .page {
    width: 210mm;
    min-height: 297mm;
    padding: 22mm 22mm 18mm;
    margin: 16px auto;
    background: var(--paper);
    position: relative;
    box-shadow: 0 4px 30px rgba(0,0,0,0.14);
    page-break-after: always;
    display: flex;
    flex-direction: column;
  }
  .page:last-child { page-break-after: auto; }

  /* ── Header ── */
  .head { margin-bottom: 11mm; }

  .kicker {
    font-size: 8pt;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 500;
    margin-bottom: 10px;
  }

  .latin-name {
    font-size: 31pt;
    line-height: 1.08;
    color: var(--ink);
    font-weight: 400;
    margin: 0;
  }

  .common-name {
    font-size: 11pt;
    color: var(--soft);
    font-weight: 400;
    margin-top: 9px;
    letter-spacing: 0.01em;
  }

  /* The grey qualifier after the common name — e.g. "×3" or synonyms */
  .qualifier {
    color: var(--faint);
    font-weight: 400;
  }
  .qualifier::before {
    content: "·";
    margin: 0 8px;
    color: var(--hair);
  }

  /* ── Top grid: photo left, quick-glance panel right ── */
  .top {
    display: grid;
    grid-template-columns: 1fr 58mm;
    gap: 11mm;
    margin-bottom: 11mm;
  }

  /* Photo box — shows image if set, otherwise a quiet placeholder */
  .photo {
    aspect-ratio: 4 / 3;
    background: var(--hair-soft);
    border: 1px solid var(--hair);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Placeholder hint shown when no photo is set */
  .photo-placeholder {
    color: var(--faint);
    font-size: 9pt;
    text-align: center;
    padding: 12px;
    letter-spacing: 0.02em;
  }

  /* Quick-glance panel — right-hand column */
  .glance { padding-top: 2px; }

  .glance .g-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--hair-soft);
    font-size: 9.5pt;
  }
  .glance .g-row:first-child { padding-top: 0; }

  .glance dt {
    color: var(--faint);
    font-size: 8pt;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    align-self: center;
  }
  .glance dd {
    margin: 0;
    text-align: right;
    color: var(--ink);
    font-weight: 500;
  }

  /* ── Care sections — two-column flow ── */
  .sections {
    columns: 2;
    column-gap: 11mm;
    margin-bottom: 2mm;
  }

  section {
    break-inside: avoid;
    margin-bottom: 7mm;
  }

  section h2 {
    font-size: 8pt;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 600;
    margin: 0 0 5px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--hair);
  }

  section p,
  section ul {
    margin: 0;
    font-size: 9.5pt;
    color: var(--soft);
    line-height: 1.55;
  }

  section ul {
    padding-left: 15px;
  }

  section li { margin-bottom: 2px; }

  /* ── Log strip — pinned to page bottom ── */
  .log {
    margin-top: auto;           /* pushes log strip to the page foot */
    border-top: 1px solid var(--hair);
    padding-top: 7mm;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7mm 9mm;
  }

  .log .l-item { font-size: 9pt; }

  .log dt {
    font-size: 7.5pt;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 500;
    margin-bottom: 4px;
  }

  .log dd {
    margin: 0;
    color: var(--soft);
    min-height: 14px;
    border-bottom: 1px solid var(--hair-soft);
    padding-bottom: 5px;
  }

  /* Source and Pot/Soil span two columns */
  .log .l-wide { grid-column: span 2; }

  /* ── Ruled notes block ── */
  .notes-block { margin-top: 6mm; }

  .notes-block h2 {
    font-size: 7.5pt;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 500;
    margin: 0 0 6px;
  }

  /* Ruled lines via a repeating gradient — no extra elements needed */
  .notes-lines {
    height: 18mm;
    background-image: repeating-linear-gradient(
      var(--paper),
      var(--paper) 8mm,
      var(--hair-soft) 8mm,
      var(--hair-soft) calc(8mm + 0.7px)
    );
  }

  /* ── Page footer ── */
  .foot {
    margin-top: 7mm;
    display: flex;
    justify-content: space-between;
    font-size: 7.5pt;
    color: var(--faint);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border-top: 1px solid var(--hair);
    padding-top: 6px;
  }

  /* ============================================================
     HELPER BAR
     Screen-only. Hidden when printing.
     ============================================================ */
  .helper {
    max-width: 210mm;
    margin: 18px auto 0;
    padding: 13px 18px;
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 3px;
    font-size: 12.5px;
    color: var(--soft);
    line-height: 1.7;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 0;
  }

  .helper code {
    background: var(--hair-soft);
    padding: 1px 6px;
    border-radius: 3px;
    color: var(--ink);
  }

  .helper strong { color: var(--ink); font-weight: 600; }

  /* "Save frozen copy" button — sits at the right of the helper bar */
  #btn-freeze {
    margin-left: auto;
    padding: 5px 14px;
    background: var(--paper);
    border: 1px solid var(--hair);
    border-radius: 3px;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  #btn-freeze:hover { border-color: var(--green); color: var(--green); }

  /* ============================================================
     PRINT OVERRIDES
     ============================================================ */
  @media print {
    html, body { background: #fff; }

    .page {
      margin: 0;
      box-shadow: none;
      width: auto;
      min-height: auto;
    }

    /* Hide the helper bar and freeze button entirely when printing */
    .helper { display: none; }

    @page { size: A4; margin: 0; }
  }

</style>
</head>
<body>

<!-- Helper bar — screen only, hidden in print -->
<div class="helper">
  <strong>Print:</strong>&nbsp;Chrome or Edge → Print → Save as PDF → A4 → tick <em>Background graphics</em>.
  &nbsp;|&nbsp;
  <strong>Photos:</strong>&nbsp;drop files in <code>photos/</code>, set <code>photo: "photos/filename.jpg"</code> in plants.js.
  &nbsp;|&nbsp;
  <strong>Add a plant:</strong>&nbsp;use <code>new-plant-prompt.md</code> with any AI, paste the result into plants.js.
  <button id="btn-freeze">Save frozen copy</button>
</div>

<!-- ============================================================
     PLANT PAGES
     The renderer below builds one <article> here per plant record.
     ============================================================ -->
<div id="catalogue"></div>


<!-- plants.js must be loaded before the renderer script below.
     It declares the global `plants` array. -->
<script src="plants.js"></script>

<script>
  /* ============================================================
     RENDERER
     Reads the `plants` array from plants.js and builds one page
     article per record using createElement + textContent so that
     no plant text is ever interpreted as HTML.
     ============================================================ */

  // ── Helpers ─────────────────────────────────────────────────

  /**
   * Create an element, optionally set its textContent, and add
   * any CSS class names.
   * e.g. el("p", "Hello world", "my-class")
   */
  function el(tag, text, ...classes) {
    const e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = text;
    if (classes.length) e.className = classes.join(" ");
    return e;
  }

  /**
   * Append one or more child elements to a parent.
   * Returns the parent for easy chaining.
   */
  function append(parent, ...children) {
    children.forEach(c => parent.appendChild(c));
    return parent;
  }

  // ── Error display ────────────────────────────────────────────

  /**
   * Show a helpful plain-text error instead of a blank page
   * when plants.js is missing or broken.
   */
  function showLoadError(reason) {
    const box = document.getElementById("catalogue");
    box.style.cssText = [
      "max-width:500px", "margin:60px auto", "padding:28px 32px",
      "background:#fff", "border:1px solid #e3e4dd", "border-radius:4px",
      "font-family:system-ui,sans-serif", "color:#2a2d28", "line-height:1.7"
    ].join(";");

    const h = el("h2", "Catalogue could not load");
    h.style.cssText = "margin:0 0 12px;font-size:18px;";
    box.appendChild(h);

    const msg = el("p", reason);
    msg.style.cssText = "margin:0 0 12px;color:#5c5f57;";
    box.appendChild(msg);

    const hint = el("p",
      "Check that plants.js is in the same folder as catalogue.html " +
      "and that its contents are valid JavaScript " +
      "(no missing commas, unclosed brackets, etc.)."
    );
    hint.style.cssText = "margin:0;color:#9a9d92;font-size:14px;";
    box.appendChild(hint);
  }

  // ── Page builder ─────────────────────────────────────────────

  /**
   * Build and return one <article class="page"> DOM node
   * for the given plant record object.
   */
  function buildPage(plant) {
    const article = el("article");
    article.className = "page";

    // ─ Header ─────────────────────────────────────────────────
    const head = el("header", null, "head");

    append(head, el("div", plant.family, "kicker"));

    const h1 = el("h1", plant.latin, "latin-name", "latin");
    head.appendChild(h1);

    // Common name line — with optional qualifier span
    const commonLine = el("div", null, "common-name");
    commonLine.appendChild(document.createTextNode(plant.common));
    if (plant.qualifier) {
      const q = el("span", plant.qualifier, "qualifier");
      commonLine.appendChild(q);
    }
    head.appendChild(commonLine);

    article.appendChild(head);

    // ─ Top grid: photo + glance ────────────────────────────────
    const top = el("div", null, "top");

    // Photo box — no <img> if photo field is empty (fixes v2 glitch)
    const photoBox = el("div", null, "photo");
    if (plant.photo) {
      const img = document.createElement("img");
      img.src = plant.photo;
      img.alt = plant.common + " (" + plant.latin + ")";
      photoBox.appendChild(img);
    } else {
      photoBox.appendChild(
        el("span",
          "Photo — add an image to /photos and set photo: \"photos/…\" in plants.js",
          "photo-placeholder"
        )
      );
    }
    top.appendChild(photoBox);

    // Quick-glance panel
    const glance = el("dl", null, "glance");
    const glanceRows = [
      ["Light",      plant.glance.light],
      ["Water",      plant.glance.water],
      ["Humidity",   plant.glance.humidity],
      ["Temp",       plant.glance.temp],
      ["Toxicity",   plant.glance.toxicity],
      ["Difficulty", plant.glance.difficulty]
    ];
    glanceRows.forEach(([label, value]) => {
      const row = el("div", null, "g-row");
      append(row, el("dt", label), el("dd", value));
      glance.appendChild(row);
    });
    top.appendChild(glance);

    article.appendChild(top);

    // ─ Care sections ──────────────────────────────────────────
    const sections = el("div", null, "sections");

    function careSection(title, content) {
      const sec = el("section");
      sec.appendChild(el("h2", title));

      if (Array.isArray(content)) {
        // Array → bulleted list (used for pests)
        const ul = el("ul");
        content.forEach(item => append(ul, el("li", item)));
        sec.appendChild(ul);
      } else {
        sec.appendChild(el("p", content));
      }
      return sec;
    }

    append(sections,
      careSection("About",                plant.about),
      careSection("Growing Cycle",        plant.cycle),
      careSection("Watering",             plant.watering),
      careSection("Feeding",              plant.feeding),
      careSection("Pests & Stress Signals", plant.pests),
      careSection("Origins & Notes",      plant.origins)
    );

    article.appendChild(sections);

    // ─ Log strip ──────────────────────────────────────────────
    const log = el("dl", null, "log");

    // Helper to add one log cell; wide = spans two columns
    function logItem(label, value, wide) {
      const div = el("div", null, "l-item" + (wide ? " l-wide" : ""));
      div.appendChild(el("dt", label));
      div.appendChild(el("dd", value || "\u00a0")); // non-breaking space keeps the ruled line visible
      log.appendChild(div);
    }

    // Special label for the orchid: "Pot / Bark Mix"; all others: "Pot / Soil"
    const potLabel = plant.family === "Orchidaceae" ? "Pot / Bark Mix" : "Pot / Soil";

    logItem("Acquired",    plant.log.acquired);
    logItem("Source",      plant.log.source,      true);  // wide
    logItem("Location",    plant.log.location);
    logItem("Last Repotted", plant.log.repotted);
    logItem(potLabel,      plant.log.potSoil,     true);  // wide
    logItem("Propagation", plant.log.propagation);

    article.appendChild(log);

    // ─ Notes block ────────────────────────────────────────────
    const notes = el("div", null, "notes-block");
    notes.appendChild(el("h2", "Notes & Care Log"));
    notes.appendChild(el("div", null, "notes-lines"));
    article.appendChild(notes);

    // ─ Footer ─────────────────────────────────────────────────
    const foot = el("div", null, "foot");
    foot.appendChild(el("span", "Houseplant Catalogue"));
    foot.appendChild(el("span", plant.latin, "latin")); // Latin name in footer = italic too
    article.appendChild(foot);

    return article;
  }

  // ── Main render ──────────────────────────────────────────────

  (function render() {
    // Guard: plants.js must have loaded and declared window.plants
    if (typeof plants === "undefined" || !Array.isArray(plants)) {
      showLoadError(
        "plants.js either did not load or does not declare a " +
        "\"const plants = [ … ]\" array."
      );
      return;
    }

    if (plants.length === 0) {
      showLoadError("plants.js loaded but the plants array is empty.");
      return;
    }

    const catalogue = document.getElementById("catalogue");
    plants.forEach(plant => catalogue.appendChild(buildPage(plant)));
  })();


  /* ============================================================
     FROZEN COPY EXPORT
     Clicking "Save frozen copy" clones the rendered DOM, strips
     all <script> tags and the helper bar, then downloads the
     result as a static HTML file.
     ============================================================ */

  document.getElementById("btn-freeze").addEventListener("click", function () {
    // Clone the whole document so we can mutate without affecting the live page
    const clone = document.documentElement.cloneNode(true);

    // Remove all <script> elements — the frozen copy needs no JS
    clone.querySelectorAll("script").forEach(s => s.remove());

    // Remove the helper bar (it has class "helper")
    clone.querySelectorAll(".helper").forEach(h => h.remove());

    // Compose the file — doctype + cleaned HTML
    const html = "<!DOCTYPE html>\n" + clone.outerHTML;

    // Build a filename like catalogue-frozen-2026-01-15.html
    const today = new Date().toISOString().slice(0, 10); // "YYYY-MM-DD"
    const filename = "catalogue-frozen-" + today + ".html";

    // Trigger a download via a temporary invisible link
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = filename;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();

    // Clean up immediately
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

</script>
</body>
</html>
